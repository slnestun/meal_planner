<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan your weekly meals with Meal Planner." />
    <meta name="author" content="Nestor" />
    <meta name="theme-color" content="#6baa75" />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Meal Plan | Meal Planner</title>
  </head>
  <body>
    <header id="main-header" class="site-header"></header>
    <main id="app" class="planner-page" tabindex="-1">
      <h1>Weekly Meal Planner</h1>
      <p class="intro">Plan lunch and dinner for the week. Add a recipe or remove a meal to make room.</p>
      <div class="week-controls">
        <button id="previous-week" type="button">Previous week</button>
        <h2 id="week-label" aria-live="polite">Current week</h2>
        <button id="next-week" type="button">Next week</button>
      </div>
      <section id="planner-grid" class="planner-grid" aria-label="Weekly meal plan"></section>
    </main>
    <footer id="main-footer" class="site-footer"></footer>
    <script type="module" src="../js/planner.js"></script>
  </body>
</html>
