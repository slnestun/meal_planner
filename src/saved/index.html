<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View your saved Meal Planner recipes." />
    <link rel="stylesheet" href="../css/style.css" />
    <title>Favorites | Meal Planner</title>
  </head>
  <body>
    <header id="main-header" class="site-header"></header>
    <main class="saved-page">
      <p class="eyebrow">Your collection</p>
      <h1>Favorite recipes</h1>
      <p class="intro">Keep the recipes you want to cook again in one place.</p>
      <p id="favorites-count" class="results-count" aria-live="polite"></p>
      <section id="favorites-list" class="recipe-results" aria-live="polite"></section>

      <section class="shopping-section" aria-labelledby="shopping-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">From your meal plan</p>
            <h2 id="shopping-title">Shopping list</h2>
          </div>
          <button id="reset-shopping-list" class="text-button" type="button">Reset list</button>
        </div>
        <div id="shopping-list" aria-live="polite"></div>
      </section>
    </main>
    <footer id="main-footer" class="site-footer"></footer>
    <script type="module" src="../js/saved.js"></script>
  </body>
</html>
