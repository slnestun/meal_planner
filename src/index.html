<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Plan meals, discover recipes, and organize your shopping list."
    />
    <meta name="author" content="Nestor" />
    <meta name="theme-color" content="#6baa75" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Meal Planner</title>
  </head>
  <body>
    <header id="main-header" class="site-header"></header>

    <main id="app" tabindex="-1">
      <section class="search-hero" aria-labelledby="page-title">
        <h1 id="page-title">Find your next meal</h1>
        <p class="intro">
          Search for a recipe or use an ingredient you already have.
        </p>

        <form id="recipe-search-form" class="search-panel">
          <div class="field-group field-group--wide">
            <label for="recipe-query">Search recipes</label>
            <input
              id="recipe-query"
              name="query"
              type="search"
              placeholder="Enter a recipe name or ingredient"
              autocomplete="off"
            />
          </div>

          <div class="field-group">
            <label for="category-filter">Category</label>
            <select id="category-filter" name="category">
              <option value="">All categories</option>
            </select>
          </div>

          <button type="submit">Search</button>
        </form>
      </section>

      <section class="results-section" aria-labelledby="results-title">
        <div class="section-heading">
          <h2 id="results-title">Recipe results</h2>
          <p id="results-count" class="results-count" aria-live="polite">
            Start with a search
          </p>
        </div>

        <div id="recipe-results" class="recipe-results" aria-live="polite">
          <div class="empty-state">
            <span class="empty-state__icon" aria-hidden="true">⌕</span>
            <h3>What would you like to cook?</h3>
            <p>Search by recipe name or ingredient to discover meal ideas.</p>
          </div>
        </div>
      </section>
    </main>

    <footer id="main-footer" class="site-footer"></footer>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
